name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # None of these ran on a pull request before: lint and the type check lived
      # only on the developer's machine, and the test suite did not exist.
      - run: npm run lint
      - run: npm test
      - run: npm run build
