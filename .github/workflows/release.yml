name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      gateMode:
        description: |
          SemVer 版本门禁模式。strict=不一致即中止（默认）；warn=只告警；off=跳过。
          门禁内容：版本声明点不漂移、版本号合法、tag 与版本号一致、版本号严格
          递增、区间内有 feat 却只升 PATCH 则拦截。规则见 VERSIONING.md。
        type: choice
        options:
          - strict
          - warn
          - off
        default: strict

# Least privilege by default; the one job that needs to write declares it itself.
# A workflow-level `contents: write` handed a push-capable token to every step,
# including `npm ci` and the build.
permissions:
  contents: read

jobs:
  # Split in two on purpose. The checks need no write access at all, and the
  # publishing step does; running them in one job means the token that can push
  # is present in the environment of `npm ci`, `lint`, `test` and `build`.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to full commit SHAs: tags are mutable, and a compromised upstream
      # action would otherwise run its new code with this repository's token.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The SemVer gate compares this release against the previous one, so it
          # needs the tag history and the commits in between, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      # Fails in seconds rather than after npm ci + lint + test + build: a release
      # that reuses a version number, skips the increment, or carries a feat under
      # a PATCH bump is already wrong before the package is built.
      - name: SemVer 版本门禁
        if: inputs.gateMode != 'off'
        env:
          GATE_MODE: ${{ inputs.gateMode || 'strict' }}
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./theme.json').version")"
            echo "非 tag 触发：按 theme.json 声明的版本 $TAG 校验"
          fi
          python3 scripts/version_gate.py \
            --tag "$TAG" \
            --version-file theme.json:version \
            --version-file package.json:version \
            --check-commits \
            --mode "$GATE_MODE"

      # A version number written into theme.json but never tagged leaves a hole in
      # the release sequence. The two already-spent numbers this repo is carrying
      # are recorded in the allowlist; see VERSIONING.md.
      - name: SemVer 历史审计
        if: (inputs.gateMode || 'strict') == 'strict'
        run: |
          set -e
          python3 scripts/version_gate.py \
            --audit-history theme.json:version \
            --audit-allowlist scripts/version-audit-allowlist.txt

      - run: npm ci

      # A release is the one place the checks used to be skipped, and by the time
      # the panel has offered the package there is no taking it back.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Same licence check as CI: a release is the artifact that actually gets
      # redistributed, so this is the last place it can be caught.
      - name: 第三方许可证声明必须是最新的
        run: node tools/gen-notices.mjs --check

      # theme.json and package.json drift apart otherwise, and the panel is the
      # one that reads the former.
      - name: theme.json version must match the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./theme.json').version")"
          if [ "$tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match theme.json version $declared" >&2
            exit 1
          fi

      # preview.png is optional in the theme format, so a missing one must not
      # take the whole release down the way a hard-coded name did.
      # THIRD_PARTY_NOTICES.md is not optional: the tarball is the artifact
      # people redistribute, so the notices have to be inside it.
      - name: pack
        run: |
          files=(dist theme.json THIRD_PARTY_NOTICES.md)
          if [ -f preview.png ]; then files+=(preview.png); fi
          tar czf theme.tar.gz "${files[@]}"
          sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: theme-package
          path: |
            theme.tar.gz
            theme.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job that writes. Scoped here rather than at workflow level so the
    # verify job above never holds a push-capable token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: theme-package

      # Re-running a tag used to fail outright on an existing release; uploading
      # over it is what a re-release is asking for.
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" theme.tar.gz theme.tar.gz.sha256 \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
